<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vector Eyes Robot</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: black;
  overflow: hidden;
}

/* center container */
.face {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  display: flex;
  gap: 80px;
}

/* EYE STYLE (IMPORTANT PART) */
.eye {
  width: 140px;
  height: 140px;
  background: #00e5ff;
  border-radius: 25px;

  /* glow effect */
  box-shadow:
    0 0 15px #00e5ff,
    0 0 40px #00e5ff,
    inset 0 0 20px rgba(255,255,255,0.2);

  position: relative;
  overflow: hidden;

  animation: blink 5s infinite;
}

/* inner dark pupil */
.pupil {
  width: 60px;
  height: 60px;
  background: black;
  border-radius: 15px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
}

/* blink animation */
@keyframes blink {
  0%, 92%, 100% {
    transform: scaleY(1);
  }
  95% {
    transform: scaleY(0.05);
  }
}

/* subtle hover alive effect */
.eye::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(255,255,255,0.2), transparent);
}
</style>
</head>

<body>

<div class="face">
  <div class="eye"><div class="pupil"></div></div>
  <div class="eye"><div class="pupil"></div></div>
</div>

</body>
</html>
