<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection"></script>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

#eyes {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  gap: 40px;
}

.eye {
  width: 120px;
  height: 120px;
  background: cyan;
  border-radius: 25px;
  box-shadow: 0 0 25px cyan;
  transition: all 0.12s ease;
}
</style>
</head>

<body>

<div id="eyes">
  <div class="eye"></div>
  <div class="eye"></div>
</div>

<video id="video" autoplay playsinline style="display:none;"></video>

<script>
let eyeW = 120;
let eyeH = 120;
let gap = 40;

let lastX = 0.5;
let noFace = 0;

const video = document.getElementById("video");

// ---------------- CAMERA FIX (IMPORTANT) ----------------
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" },
    audio: false
  });

  video.srcObject = stream;

  await new Promise(resolve => {
    video.onloadedmetadata = () => {
      video.play();
      resolve();
    };
  });

  startFace();
}

// ---------------- MEDIA PIPE ----------------
const faceDetection = new FaceDetection.FaceDetection({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
});

faceDetection.setOptions({
  model: "short",
  minDetectionConfidence: 0.5
});

faceDetection.onResults(onResults);

// ---------------- FIXED LOOP ----------------
async function startFace() {
  setInterval(async () => {
    await faceDetection.send({ image: video });
  }, 100);
}

// ---------------- EMOTION ----------------
function setEmotion(type) {
  if (type === "neutral") {
    eyeW = 120; eyeH = 120; gap = 40;
  }
  if (type === "curious") {
    eyeW = 140; eyeH = 130; gap = 25;
  }
  if (type === "surprised") {
    eyeW = 100; eyeH = 160; gap = 20;
  }
  if (type === "sleep") {
    eyeW = 120; eyeH = 60; gap = 50;
  }
}

// ---------------- FIXED FACE PARSING ----------------
function onResults(results) {

  if (!results.detections || results.detections.length === 0) {
    noFace += 1;
    if (noFace > 20) setEmotion("sleep");
    apply();
    return;
  }

  noFace = 0;

  const box = results.detections[0].boundingBox;

  // FIX: correct safe parsing
  const x = box.xCenter || 0.5;

  const speed = Math.abs(x - lastX);
  lastX = x;

  if (speed > 0.08) {
    setEmotion("surprised");
  } else if (x > 0.6) {
    setEmotion("curious");
  } else {
    setEmotion("neutral");
  }

  apply();
}

// ---------------- APPLY UI ----------------
function apply() {
  document.querySelectorAll(".eye").forEach(e => {
    e.style.width = eyeW + "px";
    e.style.height = eyeH + "px";
  });

  document.getElementById("eyes").style.gap = gap + "px";
}

// ---------------- START ON TAP (iOS REQUIRED) ----------------
document.body.addEventListener("click", startCamera);

</script>

</body>
</html>
