<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector Eyes</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

#eyes {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  gap: 40px;
}

.eye {
  width: 120px;
  height: 120px;
  background: cyan;
  border-radius: 25px;
  box-shadow: 0 0 25px cyan;
  transition: all 0.15s ease;
  opacity: 0.9;
}
</style>
</head>

<body>

<div id="eyes">
  <div class="eye"></div>
  <div class="eye"></div>
</div>

<video class="input_video" style="display:none;"></video>

<script>
let eyeW = 120;
let eyeH = 120;
let gap = 40;

let lastX = 0.5;
let noFaceTime = 0;

function applyEyes() {
  document.querySelectorAll(".eye").forEach(e => {
    e.style.width = eyeW + "px";
    e.style.height = eyeH + "px";
  });

  document.getElementById("eyes").style.gap = gap + "px";
}

// ---------------- EMOTION ENGINE ----------------

function setEmotion(type) {
  switch(type) {

    case "neutral":
      eyeW = 120;
      eyeH = 120;
      gap = 40;
      break;

    case "curious":
      eyeW = 140;
      eyeH = 130;
      gap = 25;
      break;

    case "surprised":
      eyeW = 100;
      eyeH = 160;
      gap = 20;
      break;

    case "sleep":
      eyeW = 120;
      eyeH = 60;
      gap = 50;
      break;
  }
}

// ---------------- FACE TRACKING ----------------

const videoElement = document.querySelector(".input_video");

const faceDetection = new FaceDetection.FaceDetection({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
});

faceDetection.setOptions({
  model: "short",
  minDetectionConfidence: 0.6
});

faceDetection.onResults(onResults);

const camera = new Camera(videoElement, {
  onFrame: async () => {
    await faceDetection.send({ image: videoElement });
  },
  width: 640,
  height: 480
});

camera.start();

// ---------------- MAIN LOGIC ----------------

function onResults(results) {

  // ❌ NO FACE = sleep timer
  if (!results.detections.length) {
    noFaceTime += 100;

    if (noFaceTime > 3000) {
      setEmotion("sleep");
      applyEyes();
    }
    return;
  }

  noFaceTime = 0;

  let box = results.detections[0].boundingBox;
  let x = box.xCenter;

  // movement speed
  let speed = Math.abs(x - lastX);
  lastX = x;

  // 🧠 EMOTION LOGIC

  if (speed > 0.08) {
    setEmotion("surprised");
  }
  else if (x > 0.6) {
    setEmotion("curious");
  }
  else {
    setEmotion("neutral");
  }

  applyEyes();
}

// idle animation loop (Vector breathing feel)
setInterval(() => {
  let pulse = Math.sin(Date.now() / 600);

  document.querySelectorAll(".eye").forEach(e => {
    e.style.opacity = 0.7 + pulse * 0.2;
    e.style.boxShadow = `0 0 ${20 + pulse * 10}px cyan`;
  });

}, 50);

</script>

</body>
</html>
