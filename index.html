<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector Eyes FIX</title>

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

#eyes {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  gap: 40px;
}

.eye {
  width: 120px;
  height: 120px;
  background: cyan;
  border-radius: 25px;
  box-shadow: 0 0 25px cyan;
  transition: all 0.1s ease;
}
</style>
</head>

<body>

<div id="eyes">
  <div class="eye"></div>
  <div class="eye"></div>
</div>

<video id="video" autoplay muted playsinline style="display:none;"></video>

<script>
let eyeW = 120;
let eyeH = 120;
let gap = 40;

let lastX = 0.5;

// ---------------- CAMERA ----------------
async function startCamera() {
  const video = document.getElementById("video");

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" },
    audio: false
  });

  video.srcObject = stream;

  await video.play();
  startDetection();
}

// ---------------- FACE API LOAD ----------------
async function loadModels() {
  const MODEL_URL = "https://cdn.jsdelivr.net/npm/face-api.js/models";

  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
}

// ---------------- DETECTION LOOP ----------------
function startDetection() {
  const video = document.getElementById("video");

  setInterval(async () => {

    const result = await faceapi.detectSingleFace(
      video,
      new faceapi.TinyFaceDetectorOptions()
    );

    if (!result) return;

    const box = result.box;

    let x = (box.x + box.width / 2) / video.videoWidth;

    let speed = Math.abs(x - lastX);
    lastX = x;

    // -------- EMOTION LOGIC --------
    if (speed > 0.08) {
      setSurprised();
    }
    else if (x > 0.6) {
      setCurious();
    }
    else {
      setNeutral();
    }

    apply();

  }, 120);
}

// ---------------- EMOTIONS ----------------
function setNeutral() {
  eyeW = 120; eyeH = 120; gap = 40;
}

function setCurious() {
  eyeW = 140; eyeH = 130; gap = 25;
}

function setSurprised() {
  eyeW = 100; eyeH = 160; gap = 20;
}

function apply() {
  document.querySelectorAll(".eye").forEach(e => {
    e.style.width = eyeW + "px";
    e.style.height = eyeH + "px";
  });

  document.getElementById("eyes").style.gap = gap + "px";
}

// ---------------- START (IMPORTANT FOR IPHONE) ----------------
document.body.addEventListener("click", async () => {
  await loadModels();
  await startCamera();
});

</script>

</body>
</html>
